# .github/workflows/ecr-build-push.yml
name: ECR Build and Push

on:
  workflow_call:
    inputs:
      # ecr-repository:
      #   description: ECR repository name (must already exist)
      #   required: true
      #   type: string
      aws-region:
        required: true
        type: string
        default: "us-east-1"
      oidc-role:
        required: true
        type: string
        default: "arn:aws:iam::270453428528:role/GitHubActionsOIDCRole"
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      context:
        required: false
        type: string
        default: .
      platforms:
        required: false
        type: string
        default: linux/amd64
    # secrets:
    #   AWS_ROLE_TO_ASSUME:
    #     required: true
    # outputs:
    #   image-digest:
    #     description: Digest of the pushed image
    #     value: ${{ jobs.build-push.outputs.digest }}

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # outputs:
    #   digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.oidc-role }} ##secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws-region }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

